# The site is built locally against a running Strapi and deployed as
# finished output — Netlify never builds it, because Strapi is not
# reachable from their runners.
[build]
  publish = "dist"
  command = ""

# Netlify's "pretty URLs" post-processing lowercases every path. YouTube
# video ids are case-sensitive and all 172 of ours contain uppercase, so it
# 301s every video page to a slug that is not a real video id — and the id
# IS the permanent slug here, chosen so an old pasted link still resolves.
[build.processing.html]
  pretty_urls = false

[[headers]]
  for = "/search-index.json"
  [headers.values]
    Cache-Control = "public, max-age=300"
